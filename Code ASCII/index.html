<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII Cinema · Local</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d16;color:#e5effa;font:15px system-ui,sans-serif}#app{min-height:100dvh;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:1600px;margin:auto}header,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{margin:0;font-size:24px;letter-spacing:2px}small{color:#9caec5}button,select,input::file-selector-button{background:#18293f;color:#e5effa;border:1px solid #39516c;border-radius:8px;padding:10px;cursor:pointer;font:inherit}button:hover{background:#29435e}button:disabled{opacity:.4;cursor:default}input{accent-color:#6ef0c0}label{display:flex;gap:8px;align-items:center}#file{max-width:100%}#stage{position:relative;background:#000;border:1px solid #263a52;border-radius:12px;height:64vh;min-height:220px;overflow:hidden;display:grid;place-items:center}#video,#screen{position:absolute;width:100%;height:100%;object-fit:contain}#video{z-index:0}#screen{z-index:1;background:black}#screen[hidden]{display:none}#empty{z-index:2;color:#a8bed5;text-align:center;padding:24px;pointer-events:none}#seek{flex:1;min-width:120px}#volume{width:100px}#status{min-height:24px;color:#8af2c8;overflow-wrap:anywhere}details{border:1px solid #263a52;border-radius:8px;padding:12px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#aebed1}#app:fullscreen{max-width:none;background:#080d16;overflow:auto}#app:fullscreen #stage{flex:1}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #6ef0c0;outline-offset:3px}@media(max-width:600px){#app{padding:10px}#stage{height:52vh}h1{font-size:20px}}
</style>
<main id="app">
<header><div><h1>ASCII CINEMA</h1><small>Imagen y sonido · Sin conexión</small></div></header>
<div class="row"><label>Video <select id="playlist"><option value="0">Video 1</option><option value="1">Video 2</option></select></label><label>Vista <select id="view"><option value="ascii">ASCII</option><option value="original">Original</option></select></label><label>Detalle <select id="quality"><option value="80">Ligero</option><option value="120" selected>Equilibrado</option><option value="180">Alto</option></select></label><label>Luz <input id="light" type="range" min="0.6" max="2" step="0.1" value="1.2"></label><button id="fullscreen">Pantalla completa</button></div>
<section id="stage" aria-label="Pantalla de video"><video id="video" playsinline preload="auto"></video><canvas id="screen" aria-label="Video convertido a ASCII"></canvas><div id="empty">Abre uno o varios videos de tu equipo.<br>Después pulsa Reproducir.</div></section>
<div class="row"><button id="play" disabled>Reproducir</button><button id="stop" disabled>Detener</button><span id="clock">00:00 / 00:00</span><input id="seek" aria-label="Posición" type="range" min="0" max="1000" value="0" disabled><button id="mute" aria-pressed="false">Silenciar</button><label>Volumen <input id="volume" type="range" min="0" max="1" step="0.05" value="1"></label></div>
<div id="status" role="status" aria-live="polite">Cargando video…</div>
<details><summary>Información de reproducción</summary><span id="stats">Sin video</span><pre id="diagnostics"></pre></details>
</main>
<script src="media/biblioteca.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id), video=$('video'), canvas=$('screen');
const ctx=canvas.getContext('2d',{alpha:false});
const sample=document.createElement('canvas'), sampleCtx=sample.getContext('2d',{willReadFrequently:true});
const ramp=' .,:;irsXA253hMHGS#9B&@';
const files=[{name:'Video 1',localPath:window.CINEMA_MEDIA?.[0]},{name:'Video 2',localPath:window.CINEMA_MEDIA?.[1]}];
let callback=null,kind='',renders=0,renderMs=0,lastMediaTime=null,renderError='',lastError='',loading=false;
function status(message){$('status').textContent=message;}
function time(s){s=Number.isFinite(s)?Math.max(0,s):0;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');}
function update(){
 $('clock').textContent=time(video.currentTime)+' / '+time(video.duration);
 if(Number.isFinite(video.duration)&&video.duration>0)$('seek').value=video.currentTime/video.duration*1000;
 $('play').textContent=video.paused?'Reproducir':'Pausar';
 $('mute').textContent=video.muted?'Activar sonido':'Silenciar';$('mute').setAttribute('aria-pressed',String(video.muted));
 $('stats').textContent=video.videoWidth?`${video.videoWidth} × ${video.videoHeight} · ${renderMs.toFixed(1)} ms/render`:'Sin video';
 const q=video.getVideoPlaybackQuality?.();
 $('diagnostics').textContent=JSON.stringify({archivo:files[$('playlist').value]?.name||null,vista:$('view').value,dimensiones:[video.videoWidth,video.videoHeight],duracion:video.duration||0,tiempo:video.currentTime,pausa:video.paused,silencio:video.muted,volumen:video.volume,readyState:video.readyState,networkState:video.networkState,reloj:'requestVideoFrameCallback' in video?'fotogramas del video':'requestAnimationFrame',renders,ultimoFotograma:lastMediaTime,msRender:+renderMs.toFixed(2),fotogramasDecodificados:q?.totalVideoFrames,descartadosPorNavegador:q?.droppedVideoFrames,errorVideo:lastError,errorCanvas:renderError,soporteH264:video.canPlayType('video/mp4; codecs="avc1.42E01E, mp4a.40.2"')},null,2);
}
function cancel(){if(callback!==null){if(kind==='video')video.cancelVideoFrameCallback(callback);else cancelAnimationFrame(callback);callback=null;}}
function render(){
 if(loading||video.readyState<2||!video.videoWidth||video.seeking||$('view').value==='original')return;
 const start=performance.now();
 try{
  if(!ctx||!sampleCtx)throw Error('Canvas 2D no disponible');
  const aspect=video.videoWidth/video.videoHeight;
  // Bound the longest grid dimension so portrait clips cannot cause oversized work.
  const detail=Number($('quality').value),cols=Math.max(1,Math.round(detail*Math.min(1,aspect))),rows=Math.max(1,Math.round(cols/aspect/2));
  const w=cols*10,h=Math.max(1,Math.round(w/aspect));
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  {
   if(sample.width!==cols||sample.height!==rows){sample.width=cols;sample.height=rows;}
   sampleCtx.drawImage(video,0,0,cols,rows);
   const data=sampleCtx.getImageData(0,0,cols,rows).data,cellH=h/rows,light=Number($('light').value);
   ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);ctx.font=`bold ${Math.min(18,cellH)}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
   for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const i=(y*cols+x)*4,r=data[i],g=data[i+1],b=data[i+2];
    const lum=Math.min(1,(.2126*r+.7152*g+.0722*b)/255*light);
    const char=ramp[Math.min(ramp.length-1,Math.floor(Math.sqrt(lum)*(ramp.length-1)))];
    ctx.fillStyle=`rgb(${Math.min(255,r*light)},${Math.min(255,g*light)},${Math.min(255,b*light)})`;
    ctx.fillText(char,(x+.5)*10,(y+.5)*cellH,10);
   }
  }
  renders++;renderMs=performance.now()-start;renderError='';
 }catch(e){renderError=e.message;status('Fallo del renderizado: '+e.message+'. Prueba la vista Original.');}
}
function schedule(){
 if(callback!==null||video.paused||video.ended||loading)return;
 if('requestVideoFrameCallback' in video){kind='video';callback=video.requestVideoFrameCallback((now,meta)=>{callback=null;lastMediaTime=meta.mediaTime;render();schedule();});}
 else{kind='animation';callback=requestAnimationFrame(()=>{callback=null;if(lastMediaTime!==video.currentTime){lastMediaTime=video.currentTime;render();}schedule();});}
}
function load(index){
 if(!files[index]?.localPath){status('Falta media/biblioteca.js. Conserva la carpeta media junto a index.html.');return;}
 loading=true;cancel();video.pause();video.removeAttribute('src');video.load();
 lastError='';renderError='';lastMediaTime=null;renders=0;renderMs=0;
 ctx?.clearRect(0,0,canvas.width,canvas.height);$('empty').hidden=false;$('empty').textContent='Cargando…';
 for(const id of ['play','stop','seek'])$(id).disabled=true;
 $('seek').value=0;video.src=files[index].localPath;video.load();status('Cargando '+files[index].name);update();
}
$('playlist').addEventListener('change',()=>load(Number($('playlist').value)));
$('play').addEventListener('click',async()=>{if(!video.paused){video.pause();return;}try{await video.play();}catch(e){if(e.name!=='AbortError'){lastError=e.name+': '+e.message;status('No se pudo reproducir: '+lastError);update();}}});
$('stop').addEventListener('click',()=>{video.pause();video.currentTime=0;status('Detenido al inicio.');update();});
$('seek').addEventListener('input',()=>{if(Number.isFinite(video.duration)&&video.duration>0)video.currentTime=Number($('seek').value)/1000*video.duration;});
$('mute').addEventListener('click',()=>{video.muted=!video.muted;update();});
$('volume').addEventListener('input',()=>{video.volume=Number($('volume').value);video.muted=false;update();});
function view(){canvas.hidden=$('view').value==='original';render();update();}
$('view').addEventListener('change',view);for(const id of ['quality','light'])$(id).addEventListener('input',()=>{render();update();});
video.addEventListener('loadeddata',()=>{loading=false;$('empty').hidden=true;for(const id of ['play','stop','seek'])$(id).disabled=false;status('Listo. Pulsa Reproducir para iniciar imagen y sonido.');render();update();});
video.addEventListener('playing',()=>{cancel();status('Reproduciendo.');render();schedule();update();});
video.addEventListener('pause',()=>{cancel();render();if(!loading&&!video.ended)status(video.currentTime===0?'Detenido.':'En pausa.');update();});
video.addEventListener('ended',()=>{cancel();render();status('Video terminado.');update();});
video.addEventListener('seeked',()=>{render();update();schedule();});
video.addEventListener('timeupdate',update);video.addEventListener('volumechange',update);
video.addEventListener('error',()=>{loading=false;cancel();lastError=`Código ${video.error?.code}: ${video.error?.message||'Archivo no compatible o dañado'}`;for(const id of ['play','stop','seek'])$(id).disabled=true;$('empty').hidden=false;$('empty').textContent='No se pudo abrir este video.';status(lastError+' · Selecciona otro archivo.');update();});
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('app').requestFullscreen();}catch(e){status('Pantalla completa no disponible en esta vista. Abre index.html en Edge o Chrome.');}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','BUTTON','SUMMARY'].includes(document.activeElement.tagName)){e.preventDefault();$('play').click();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();schedule();}});
window.addEventListener('pagehide',()=>{cancel();video.pause();});
view();load(0);
</script>
</html>
